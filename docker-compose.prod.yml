services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - buddy-frontend
      - buddy-api

  buddy-frontend:
    build: 
      context: ./interfaces/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_WS_BASE_URL=/ws

  buddy-api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/buddy
      - REDIS_URL=redis://redis:6379/0
      - REPOSITORY_TYPE=postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  buddy-worker:
    build: .
    command: ["python", "worker.py"]
    restart: unless-stopped
    env_file: .env.production
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/buddy
      - REDIS_URL=redis://redis:6379/0
      - REPOSITORY_TYPE=postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=buddy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  caddy_data:
  caddy_config:
  postgres-data:
  redis-data:
